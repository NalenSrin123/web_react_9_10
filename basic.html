<style>
    .box{
        width: 350px;
        height: 350px;
        background-color: blue;
        margin-top: 30px;
    }
    button{
        cursor: pointer;
    }
</style>
<body>
    <button id="show">Show</button>
    <button id="hide">Hide</button>
    <button id="toggle">Show/Hide</button>
    <button id="stop">Stop</button>
   <div class="box">

   </div>
</body>

<script>
    // structure Jquery
    $(document).ready(function(){
        $('#show').click(function(){
            // $('.box').show(1000);
            // $('.box').fadeIn(1000);
            $('.box').slideDown(1000);
        })
        $('#hide').click(function(){
            // $('.box').hide(1000);
            // $('.box').fadeOut(1000);
            $('.box').slideUp(1000);
        })
        $('#toggle').click(function(){
            // $('.box').toggle(1000);
            // $('.box').fadeToggle(1000);
            $('.box').slideToggle(1000);
        })
        $('#stop').clickS(function(){
            $('.box').stop()
        })
    })
</script>
