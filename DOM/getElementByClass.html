<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<style>
    form{
        width: 350px;
        padding: 20px;
        background-color: #fff;
        box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
        margin: auto;
        border-radius: 5px;
    }
    .form-group {
        position: relative;
    }
    i{
        font-size: 20px;
        position: absolute;
        top: 50%;
        right: 5%;
        cursor: pointer;
    }
    .bi-eye-slash-fill{
        display: none;
    }
</style>
<body>
    <div class="container mt-5 pt-4">
        <form action="" >
            <h3 class="text-center">Login</h3>
            <div class="form-group">
                <label for="" class="form-label">Username/Email</label>
                <input type="text" name="" id="" class="form-control name_email">
            </div>
            <div class="form-group ">
                <label for="" class="form-label">Password</label>
                <input type="password" name="" id="" class="form-control password">
                <i class="bi bi-eye-fill"></i>
                <i class="bi bi-eye-slash-fill"></i>
            </div>
            <div class="form-group d-flex justify-content-center mt-2">
                <a href="">Forgot password</a>
            </div>
            <button type="button" class="btn btn-primary w-100 mt-3 login">Login</button>
        </form>
    </div>
</body>
</html>
<script>
    const login=document.getElementsByClassName('login')[0];
    login.addEventListener('click',function(){
        const name_email=document.getElementsByClassName('name_email')[0].value;
        const password=document.getElementsByClassName('password')[0].value;
        if(name_email=="Admin" || name_email=='admin@gmail.com'){
            if(password=="admin@123"){
                Swal.fire({
                title: "Success!",
                text: "Login success!",
                icon: "success"
                });
                window.location.href="dashboard.html"
            }else{
                Swal.fire({
                title: "Error!",
                text: "Invalid password!",
                icon: "error"
            });
            }
        }else{
            Swal.fire({
                title: "Error!",
                text: "Invalid username or email!",
                icon: "error"
            });
        }
    })
    const show=document.getElementsByClassName('bi-eye-fill')[0];
    const hide=document.getElementsByClassName('bi-eye-slash-fill')[0];
    const password=document.getElementsByClassName('password')[0];
    show.addEventListener('click',function(){
        show.style.display='none';
        hide.style.display='block';
        password.type='text'
    })
    hide.addEventListener('click',function(){
        hide.style.display='none'
        show.style.display='block'
        password.type='password'
    })
</script>
