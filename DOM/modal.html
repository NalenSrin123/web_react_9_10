<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<style>
    .modals{
        width: 100%;
        height: 100vh;
        background-image: linear-gradient(rgba(87, 87, 87, 0.5),rgba(87, 87, 87, 0.5));
        position: absolute;
        top: 0;
        display: none;
    }
    form{
        width: 380px;
        margin: auto;
        background-color: #fff;
        padding: 20px 25px;
        border-radius: 5px;
        animation-name: drop;
        animation-duration: 1s;
        animation-fill-mode: forwards;
        box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
    }
    @keyframes drop{
        0%{
            transform: translateY(0);
        }
        100%{
            transform: translateY(50px);
        }
    }
</style>
<body>
    <div class="container mt-4">
        <h2>User Accounts</h2>
        <button class="btn btn-primary float-end" id="addUser">Add User</button>
        <table class="table text-center align-middle " style="table-layout: fixed;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Password</th>
                    <th>Profile</th> 
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tbody">
                
            </tbody>
        </table>
    </div>
    <div class="modals">
        <form action="" id="form">
            <h3 class="text-center">Add User</h3>
            <div class="form-group">
                <label for="id" class="form-label">ID</label>
                <input type="text" name="" id="id" class="form-control">
            </div>
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" name="" id="username" class="form-control">
            </div>
            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input type="email" name="" id="email" class="form-control">
            </div>
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" name="" id="password" class="form-control">
            </div>
            <div class="form-group">
                <label for="profile" class="form-label">Profile</label>
                <input type="file" name="" id="profile" class="form-control">
            </div>
            <button type="button" class="btn btn-primary mt-3" id="btnSave">Save</button>
            <button type="button" class="btn btn-danger mt-3 ms-1" id="cancel">Cancel</button>
        </form>
    </div>
</body>
</html>
<script src="modal.js"></script>
