<!DOCTYPE html>

    <meta charset="UTF-8">

<style>
    form{
        width: 300px;
        margin: auto;
        background-color: greenyellow;
        padding: 20px;
    }
</style>
<body>
    <form action="" class="mt-5 rounded">
        <label for="" class="form-label">X :</label>
        <input class="form-control" type="text" name="x" id="">  
        <label for="" class="form-label">Y :</label>
        <input class="form-control" type="text" name="y" id=""> 
        <label for="" class="form-label">Result :</label>
        <input class="form-control" type="text" name="result" id="" disabled>
        <input type="button" class="btn btn-primary mt-2" name="sum" value="+"></input>
        <input type="button" class="btn btn-primary mt-2" name="sub" value="-"></input>
        <input type="button" class="btn btn-primary mt-2" name="mul" value="*"></input>
        <input type="button" class="btn btn-primary mt-2" name="div" value="/"></input>
    </form>
</body>
</html>
<script>
    const sum=document.getElementsByName('sum')[0];
    sum.addEventListener('click',function(){
        const x=document.getElementsByName('x')[0].value;
        const y=document.getElementsByName('y')[0].value;
        var result=document.getElementsByName('result')[0];
        result.value=Number(x)+Number(y);
    })    
    const sub=document.getElementsByName('sub')[0];
    sub.addEventListener('click',function(){
        const x=document.getElementsByName('x')[0].value;
        const y=document.getElementsByName('y')[0].value;
        var result=document.getElementsByName('result')[0];
        result.value=Number(x)-Number(y);
    })    
    const mul=document.getElementsByName('mul')[0];
    mul.addEventListener('click',function(){
        const x=document.getElementsByName('x')[0].value;
        const y=document.getElementsByName('y')[0].value;
        var result=document.getElementsByName('result')[0];
        result.value=Number(x)*Number(y);
    })    
    const div=document.getElementsByName('div')[0];
    div.addEventListener('click',function(){
        const x=document.getElementsByName('x')[0].value;
        const y=document.getElementsByName('y')[0].value;
        var result=document.getElementsByName('result')[0];
        result.value=Number(x)/Number(y);
    })
