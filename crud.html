<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<style>
    .modals{
        width: 100%;
        height: 100vh;
        position: absolute;
        top: 0;
        background-color: rgba(3, 3, 3, 0.532);
        display: none;
    }
    form{
        width: 430px;
        padding: 30px ;
        background-color: #fff;
        border-radius: 10px;
        margin: auto;
        margin-top: 50px;
    }
</style>
<body>
    <div class="container mt-3">
        <h1>Student Lists</h1>
        <button class="btn btn-primary float-end" id="addStudent">Add Student</button>
        <table class="table text-center align-middle" style="table-layout: fixed;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Sex</th>
                    <th>Address</th>
                    <th>GPA</th>
                    <th>Profile</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                
            </tbody>
        </table>
    </div>
    <div class="modals">
        <form action="">
            <h3 class="text-center" id="title"></h3>
            <div class="form-group">
                <label for="id" class="form-label" >ID</label>
                <input type="text" name="" id="id" class="form-control" disabled>
            </div>
            <div class="form-group">
                <label for="name" class="form-label">Name</label>
                <input type="text" name="" id="name" class="form-control">
            </div>
            <div class="form-group">
                <label for="sex" class="form-label">Sex</label>
                <select name="" id="sex" class="form-control"  >
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="address" class="form-label">Address</label>
                <input type="text" name="" id="address" class="form-control">
            </div>
            <div class="form-group">
                <label for="GPA" class="form-label">GPA</label>
                <input type="text" name="" id="GPA" class="form-control">
            </div>
            <div class="form-group">
                <label for="profile" class="form-label">Profile</label>
                <input type="file" name="" id="profile" class="form-control">
            </div>
              <button type="button" class="btn btn-primary mt-3 me-2" id="save">Save</button>
              <button type="button" class="btn btn-success mt-3 me-2" id="edit">Edit</button>
              <button type="button" class="btn btn-danger mt-3 me-2" id="cancel">Cancel</button>
        </form>
    </div>
</body>
</html>
<script>
    $(document).ready(function() {
        var i=1;
        $('#addStudent').click(function(){
            $('.modals').fadeIn(500)
            $('#id').val(i)  
            clearForm()  
            $('#edit').hide();
            $('#save').show();
            $('#title').text('Add Student');
        })
        $('#cancel').click(function(){
            $('.modals').fadeOut(500)
        })
        $('#save').click(function(){
            $('.modals').fadeOut(500)
            i++;
            const id=$('#id').val();
            const name=$('#name').val();
            const sex=$('#sex').val();
            const address=$('#address').val();
            const gpa=$('#GPA').val();
            const profile=$('#profile')[0].files[0];  
            $('tbody').append(`
                <tr>
                    <td>${id}</td>
                    <td>${name}</td>
                    <td>${sex}</td>
                    <td>${address}</td>
                    <td>${gpa}</td>
                    <td><img width="80px" src="${URL.createObjectURL(profile)}" alt=""></td>
                    <td>
                        <button type="button" class="btn btn-warning" id="btnEdit">Edit</button>
                        <button type="button" class="btn btn-danger" id="btnDelete">Delete</button>
                    </td>
                </tr>
            `);
        })
        function deleteStudent(){
            $(document).on('click','#btnDelete',function(){
                const tr=$(this).parents('tr');
                tr.remove()
            })
        }
        deleteStudent();
        function clearForm(){
            $('#name').val('');           
            $('#sex').val('Male');            
            $('#address').val('');
            $('#GPA').val('');
            $('#profile').val('')
        }
        function editStudent(){
            $(document).on('click','#btnEdit',function(){
                $('.modals').fadeIn();
                $('#save').hide();
                $('#edit').show();
                $('#title').text('Edit Student');
                const tr=$(this).parents('tr');
                //get data from table
                const tb_id=tr.find('td').eq(0).text();
                const tb_name=tr.find('td').eq(1).text();
                const tb_sex=tr.find('td').eq(2).text();
                const tb_address=tr.find('td').eq(3).text();
                const tb_gpa=tr.find('td').eq(4).text();
                const tb_profile=tr.find('td').eq(5).text();
                //insert data into form
                $('#id').val(tb_id)
                $('#name').val(tb_name);           
                $('#sex').val(tb_sex);            
                $('#address').val(tb_address);
                $('#GPA').val(tb_gpa);
                $('#profile').text(tb_profile);
                //get data from form insert into table
                $('#edit').click(function(){
                    $('.modals').fadeOut()
                    tr.find('td').eq(0).text($('#id').val());
                    tr.find('td').eq(1).text($('#name').val());
                    tr.find('td').eq(2).text($('#sex').val());
                    tr.find('td').eq(3).text($('#address').val());
                    tr.find('td').eq(4).text($('#GPA').val());
                    const img =tr.find('td').eq(5).find('img');
                   img.attr('src',URL.createObjectURL($('#profile')[0].files[0]))
                    
                })
            })
        }
        editStudent()
    });
  </script>
