<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<style>
    .modals{
        width: 100%;
        height: 100vh;
        position: absolute;
        top: 0;
        background-color: rgba(3, 3, 3, 0.532);
        display: none;
    }
    form{
        width: 430px;
        padding: 30px ;
        background-color: #fff;
        border-radius: 10px;
        margin: auto;
        margin-top: 50px;
    }
</style>
<body>
    <div class="container mt-3">
        <h1>Student Lists</h1>
        <button class="btn btn-primary float-end" id="addStudent">Add Student</button>
        <table class="table text-center align-middle" style="table-layout: fixed;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Sex</th>
                    <th>Address</th>
                    <th>GPA</th>
                    <th>Profile</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Bona</td>
                    <td>Male</td>
                    <td>PP</td>
                    <td>3.0</td>
                    <td><img width="80px" src="https://i.pinimg.com/736x/84/59/e9/8459e98618f904ceea429e460e7c0771.jpg" alt=""></td>
                    <td>
                        <button type="button" class="btn btn-warning">Edit</button>
                        <button type="button" class="btn btn-danger">Delete</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="modals">
        <form action="">
            <h3 class="text-center">Add Student</h3>
            <div class="form-group">
                <label for="id" class="form-label" >ID</label>
                <input type="text" name="" id="id" class="form-control" disabled>
            </div>
            <div class="form-group">
                <label for="name" class="form-label">Name</label>
                <input type="text" name="" id="name" class="form-control">
            </div>
            <div class="form-group">
                <label for="sex" class="form-label">Sex</label>
                <select name="" id="sex" class="form-control"  >
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="address" class="form-label">Address</label>
                <input type="text" name="" id="address" class="form-control">
            </div>
            <div class="form-group">
                <label for="GPA" class="form-label">GPA</label>
                <input type="text" name="" id="GPA" class="form-control">
            </div>
            <div class="form-group">
                <label for="profile" class="form-label">Profile</label>
                <input type="file" name="" id="profile" class="form-control">
            </div>
              <button type="button" class="btn btn-primary mt-3 me-2" id="save">Save</button>
              <button type="button" class="btn btn-danger mt-3 me-2" id="cancel">Cancel</button>
        </form>
    </div>
</body>
</html>
<script>
    $(document).ready(function() {
        var i=1;
        $('#addStudent').click(function(){
            $('.modals').fadeIn(500)
            $('#id').val(i)    
        })
        $('#cancel').click(function(){
            $('.modals').fadeOut(500)
        })
        $('#save').click(function(){
            $('.modals').fadeOut(500)
            i++;
        })
    });
  </script>
